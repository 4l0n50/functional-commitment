[package]
name = "functional_commitment"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ark-ff = { version = "^0.3.0", default-features = false }
ark-poly = { version = "^0.3.0", default-features = false }
pfr = { git = "https://github.com/4l0n50/pfr.git", branch = "integrate_with_fc" }
rand_chacha = { version = "0.3.0", default-features = false }
blake2 = { version = "0.9", default-features = false }
ark-relations = { version = "^0.3.0", default-features = false }
ark-poly-commit = { version = "^0.3.0", default-features = false }
ark-std = { version = "^0.3.0", default-features = false }
ac_compiler = { path = "../ac_compiler" }
ark-marlin = { git = "https://github.com/4l0n50/marlin.git", branch = "integrate_pfr" }

[dev-dependencies]
ark-bn254 = { version = "^0.3.0" }
ark-bls12-381 = { version = "^0.3.0", default-features = false, features = [ "curve" ] }
ark-serialize = { version = "^0.3.0" }
criterion = "0.5"

[[bench]]
name = "fibonacci"
harness = false
